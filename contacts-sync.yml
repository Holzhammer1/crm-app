name: iPhone Kontakte Sync

on:
  schedule:
    - cron: "0 6 * * *"   # einmal täglich, 6:00 Uhr UTC
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install caldav vobject firebase-admin

      - run: python -u contacts_sync.py
        env:
          ICLOUD_ACCOUNTS: ${{ secrets.ICLOUD_ACCOUNTS }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
